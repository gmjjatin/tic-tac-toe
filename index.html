<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tic Tac Toe</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101827;color:#f5f7fb;font:16px system-ui}.card{width:min(92vw,440px);padding:30px;border:1px solid #34445c;border-radius:24px;background:#182337}h1{margin:0}.muted{color:#a8b5c8}.row{display:flex;justify-content:space-between;margin:22px 0 14px}.turn{color:#94e3c1;font-weight:bold}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.cell{aspect-ratio:1;border:1px solid #34445c;border-radius:16px;background:#202e44;color:#f5f7fb;font-size:3.5rem;font-weight:bold;cursor:pointer}.cell.x{color:#82d9f5}.cell.o{color:#f5a8cd}.cell.win{background:#315849}.actions{display:flex;gap:10px;margin-top:20px}button.action{border:0;border-radius:12px;padding:12px 16px;font-weight:bold;cursor:pointer}.primary{background:#94e3c1}.secondary{background:#293a54;color:white}</style><main class="card"><h1>Tic Tac Toe</h1><p class="muted">A little friendly rivalry, one square at a time.</p><div class="row"><span id="status" class="turn" aria-live="polite">X's turn</span><span id="score" class="muted">X 0 · Draws 0 · O 0</span></div><div id="board" class="board" role="grid" aria-label="Tic Tac Toe"></div><div class="actions"><button class="action primary" id="new">New round</button><button class="action secondary" id="reset">Reset scores</button></div></main><script>let b=Array(9).fill(''),t='X',end=false,w=[],s={X:0,O:0,D:0};const lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]],el=document.querySelector('#board'),st=document.querySelector('#status');function draw(){el.innerHTML='';b.forEach((v,i)=>{let x=document.createElement('button');x.className='cell '+v.toLowerCase()+(w.includes(i)?' win':'');x.textContent=v;x.disabled=!!v||end;x.setAttribute('aria-label','Square '+(i+1)+(v?', '+v:''));x.onclick=()=>move(i);el.append(x)});document.querySelector('#score').textContent='X '+s.X+' · Draws '+s.D+' · O '+s.O}function move(i){if(end||b[i])return;b[i]=t;let q=lines.find(l=>l.every(n=>b[n]===t));if(q){end=true;w=q;s[t]++;st.textContent=t+' wins!'}else if(b.every(Boolean)){end=true;s.D++;st.textContent="It's a draw!"}else{t=t==='X'?'O':'X';st.textContent=t+"'s turn"}draw()}function fresh(){b=Array(9).fill('');t='X';end=false;w=[];st.textContent="X's turn";draw()}document.querySelector('#new').onclick=fresh;document.querySelector('#reset').onclick=()=>{s={X:0,O:0,D:0};fresh()};draw();</script></html>
