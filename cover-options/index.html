<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tic Tac Toe cover options</title>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:32px;background:#101827;color:#f5f7fb;font:16px/1.5 system-ui,sans-serif}.wrap{max-width:1050px;margin:auto}h1{margin:0 0 8px}.intro{margin:0 0 28px;color:#a8b5c8}.option{margin:24px 0 36px}.option h2{font-size:1rem;margin:0 0 10px;color:#94e3c1}.option img{display:block;width:100%;height:auto;border:1px solid #40536d;border-radius:14px}
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Choose a cover direction</h1>
    <p class="intro">Two vector concepts for the Tic Tac Toe game link preview.</p>
    <section class="option"><h2>Option A — Dark arcade</h2><img src="cover-option-a.svg" alt="Dark navy cover with glowing game board, cyan X marks, and a pink O mark"></section>
    <section class="option"><h2>Option B — Playful board</h2><img src="cover-option-b.svg" alt="Warm off-white tilted tic tac toe board with teal X marks and coral O marks"></section>
  </main>
</body>
</html>
